<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Under Construction</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.50),
          rgba(0, 0, 0, 0.50)
        ),
        url("assets/temple-2.jpg") center center / cover no-repeat;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .construction {
      text-align: center;
      color: white;
      padding: 30px;
    }

    .construction h1 {
      font-size: clamp(2.5rem, 7vw, 6rem);
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow:
        0 4px 15px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body>

  <main class="construction">
    <h1>THE PAGE IS UNDER CONSTRUCTION</h1>
  </main>

</body>
</html>
